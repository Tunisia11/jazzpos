name: Windows Release Build & Package
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    name: Build and verify Trace POS Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Clean, analyze, test, build, package and verify installed files
        shell: pwsh
        run: ./windows/build_windows_release.ps1 -VerifyInstall
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trace-POS-Windows-x64-Release
          path: |
            dist/Trace-POS-Setup-x64.exe
            dist/Trace-POS-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/build-info.json
            dist/installer-verification.json
          if-no-files-found: error
