name: Windows Release Build & Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Execute Automated Test Suite
        run: flutter test

      - name: Compile Windows x64 Release Executable
        run: flutter build windows --release

      - name: Verify Release Binary Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\jazzpos.exe")) {
            throw "Release binary jazzpos.exe was not created!"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer\jazzpos_setup.iss"

      - name: Verify Installer Exists and Generate SHA-256 Checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\JazzPOS_Setup_v1.0.0.exe")) {
            throw "Expected installer dist\JazzPOS_Setup_v1.0.0.exe not found!"
          }
          $hash = (Get-FileHash -Path "dist\JazzPOS_Setup_v1.0.0.exe" -Algorithm SHA256).Hash
          "$hash  JazzPOS_Setup_v1.0.0.exe" | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Write-Host "Generated SHA-256: $hash"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Raw Windows Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: JazzPOS-Windows-x64-Binaries
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: JazzPOS-Windows-x64-Installer
          path: |
            dist/JazzPOS_Setup_v1.0.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
