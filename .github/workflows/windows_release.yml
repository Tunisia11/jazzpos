name: Windows Release Build & Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Code Analysis
        run: flutter analyze

      - name: Execute Automated Test Suite
        run: flutter test

      - name: Compile Windows x64 Release Executable
        run: flutter build windows --release

      - name: Install Inno Setup Compiler
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\jazzpos_setup.iss

      - name: Generate Checksums
        id: checksums
        shell: pwsh
        run: |
          Write-Host "=== RELEASE ARTIFACT CHECKSUMS ==="
          Get-ChildItem -Path dist\*.exe | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            Write-Host "$($hash.Algorithm) ($($_.Name)): $($hash.Hash)"
            "$($hash.Hash)  $($_.Name)" | Out-File -FilePath "dist\SHA256SUMS.txt" -Append -Encoding ascii
          }
          Get-Content dist\SHA256SUMS.txt

      - name: Upload Windows Raw Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: JazzPOS-Windows-x64-Binaries
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: JazzPOS-Windows-x64-Installer
          path: |
            dist/JazzPOS_Setup_v1.0.0.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
